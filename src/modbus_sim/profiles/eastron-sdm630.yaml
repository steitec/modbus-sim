# Eastron SDM630 Modbus (three-phase DIN-rail energy meter), register map after
# "Eastron SDM630 Modbus Protocol" V1.5 (2016): every value is an IEEE 754 float32 in
# two registers, most significant register first (ABCD). Input registers 30001-30381
# (read with function 04), set-up parameters in holding registers 40001 ff. (also
# float32, function 03 / 16). Addresses below are 0-based: 30001 -> input 0.
#
# Not a copy of the meter: steitec is not affiliated with Eastron. Simplified here:
# - unlisted addresses read 0 (gaps: zero) so block reads across the map work;
#   the real meter rejects odd register counts and requests over 80 registers
# - THD values are constant with a little noise; demand values are exponential
#   averages over demand_period (the meter uses fixed demand periods)
# - set-up registers are stored only (no password, restart or register-order logic)
# - power factor sign: the protocol says negative for inductive loads (pf_sign: -1)
name: eastron-sdm630
description: Eastron SDM630 three-phase energy meter (protocol V1.5), float32 ABCD
identification:
  vendor: steitec
  product: SIM-SDM630
  revision: "1.5"
  vendor_url: https://github.com/steitec/modbus-sim
  product_name: modbus-sim profile of the Eastron SDM630 register map
  model_name: SDM630 (simulated)
word_order: ABCD
gaps: zero
model: energy_meter
model_params:
  voltage: 230.0
  frequency: 50.0
  current: [10.0, 12.0, 8.0]
  power_factor: 0.95
  pf_sign: -1
  demand_period: 3600
points:
  - {name: voltage_l1, table: input, address: 0, type: float32, unit: V, model: voltage_l1}
  - {name: voltage_l2, table: input, address: 2, type: float32, unit: V, model: voltage_l2}
  - {name: voltage_l3, table: input, address: 4, type: float32, unit: V, model: voltage_l3}
  - {name: current_l1, table: input, address: 6, type: float32, unit: A, model: current_l1}
  - {name: current_l2, table: input, address: 8, type: float32, unit: A, model: current_l2}
  - {name: current_l3, table: input, address: 10, type: float32, unit: A, model: current_l3}
  - {name: power_l1, table: input, address: 12, type: float32, unit: W, model: power_l1}
  - {name: power_l2, table: input, address: 14, type: float32, unit: W, model: power_l2}
  - {name: power_l3, table: input, address: 16, type: float32, unit: W, model: power_l3}
  - {name: apparent_power_l1, table: input, address: 18, type: float32, unit: VA,
     model: apparent_power_l1}
  - {name: apparent_power_l2, table: input, address: 20, type: float32, unit: VA,
     model: apparent_power_l2}
  - {name: apparent_power_l3, table: input, address: 22, type: float32, unit: VA,
     model: apparent_power_l3}
  - {name: reactive_power_l1, table: input, address: 24, type: float32, unit: var,
     model: reactive_power_l1}
  - {name: reactive_power_l2, table: input, address: 26, type: float32, unit: var,
