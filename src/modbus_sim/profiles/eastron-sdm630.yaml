  - {name: reactive_power_l3, table: input, address: 28, type: float32, unit: var,
     model: reactive_power_l3}
  - {name: power_factor_l1, table: input, address: 30, type: float32,
     model: power_factor_l1}
  - {name: power_factor_l2, table: input, address: 32, type: float32,
     model: power_factor_l2}
  - {name: power_factor_l3, table: input, address: 34, type: float32,
     model: power_factor_l3}
  - {name: phase_angle_l1, table: input, address: 36, type: float32, unit: deg,
